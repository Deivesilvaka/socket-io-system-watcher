<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Monitoramento em Tempo Real</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #121212; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            padding: 20px;
        }
        
        .chart-container {
            width: 100%;
            max-width: 800px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #chart { width: 100%; height: 400px; }
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-bottom: 15px;
            background: #333;
        }
    </style>
</head>
<body>

    <h2>📊 System Monitor (Sliding Window)</h2>
    <div id="status" class="status-badge">Conectando...</div>
    
    <div class="chart-container">
        <div id="chart"></div>
    </div>

    <script>
        const socket = io('http://localhost:3000');
        const chartDiv = document.getElementById('chart');
        const MAX_POINTS = 15; 

        const traceRAM = {
            x: [], y: [],
            name: 'RAM (MB)',
            mode: 'lines+markers',
            line: { color: '#00ff88', shape: 'spline' }
        };

        const traceCPU = {
            x: [], y: [],
            name: 'CPU Load',
            mode: 'lines+markers',
            yaxis: 'y2',
            line: { color: '#3399ff', shape: 'spline' }
        };

        const layout = {
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)',
            font: { color: '#ccc' },
            margin: { t: 40, b: 40, l: 50, r: 50 },
            xaxis: { 
                title: 'Últimos registros',
                showgrid: false
            },
            yaxis: { title: 'RAM (MB)', color: '#00ff88' },
            yaxis2: { 
                title: 'CPU Load', 
                overlaying: 'y', 
                side: 'right', 
                color: '#3399ff',
                showgrid: false 
            },
            legend: { x: 0.5, y: 1.1, xanchor: 'center', orientation: 'h' }
        };

        Plotly.newPlot(chartDiv, [traceRAM, traceCPU], layout, { responsive: true });

        socket.on('systemStats', (data) => {
            const time = data.timestamp;
            
            const update = {
                x: [[time], [time]],
                y: [[data.ram], [data.cpu]]
            };

            
            Plotly.extendTraces(chartDiv, update, [0, 1], MAX_POINTS);
            
            document.getElementById('status').innerHTML = 
                `🟢 Online | <span style="color:#00ff88">RAM: ${data.ram}MB</span> | <span style="color:#3399ff">CPU: ${data.cpu}</span>`;
        });

        socket.on('disconnect', () => {
            document.getElementById('status').innerText = '🔴 Desconectado';
        });
    </script>
</body>
</html>
